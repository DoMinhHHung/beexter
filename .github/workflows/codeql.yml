name: CodeQL

on:
  pull_request:
    branches:
      - main
    paths:
      - "service/identity/**"
  push:
    branches:
      - main
    paths:
      - "service/identity/**"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: service/identity/go.mod
          cache-dependency-path: service/identity/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Download dependencies
        working-directory: service/identity
        run: go mod download

      - name: Build
        working-directory: service/identity
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@v4
