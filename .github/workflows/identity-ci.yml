name: Identity CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "service/identity/**"
      - ".github/workflows/identity-ci.yml"
  push:
    branches:
      - main
    paths:
      - "service/identity/**"
      - ".github/workflows/identity-ci.yml"

permissions:
  contents: read

concurrency:
  group: identity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/identity

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: service/identity/go.mod
          cache-dependency-path: service/identity/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/identity
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: service/identity/go.mod
          cache-dependency-path: service/identity/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run isolated integration tests
        env:
          IDENTITY_INTEGRATION_TEST: "1"
          DATABASE_DIRECT_URL: postgres://postgres:postgres@127.0.0.1:5432/identity_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_DB: "15"
        run: go test -tags=integration -count=1 -timeout=5m -v ./internal/integration
