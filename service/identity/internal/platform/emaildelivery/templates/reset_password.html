<!doctype html>
<html lang="{{.Locale}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.I18n.Title}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#17212b;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="background:#f4f6f8;padding:32px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                   style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(17,24,39,.08);">
                <tr>
                    <td style="padding:28px 32px;background:#111827;color:#ffffff;">
                        <div style="font-size:24px;font-weight:700;">BeexSter</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:36px 32px;">
                        <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;color:#111827;">
                            {{.I18n.Title}}
                        </h1>
                        <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">{{.I18n.Greeting}}</p>
                        <p style="margin:0 0 12px;font-size:16px;line-height:1.6;">{{.I18n.Message1}}</p>
                        <p style="margin:0 0 20px;font-size:16px;line-height:1.6;">{{.I18n.Message2}}</p>
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:28px 0;">
                            <tr>
                                <td style="border-radius:8px;background:#dc2626;">
                                    <a href="{{.PasswordResetURL}}"
                                       style="display:inline-block;padding:14px 24px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;">
                                        {{.I18n.ButtonText}}
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:0 0 12px;font-size:14px;line-height:1.6;color:#4b5563;">
                            {{.I18n.ExpireMsg}} <strong>{{.ExpiresAt}}</strong>.
                        </p>
                        <p style="margin:0 0 8px;font-size:14px;line-height:1.6;color:#4b5563;">
                            {{.I18n.FallbackMsg}}
                        </p>
                        <p style="margin:0;word-break:break-all;font-size:13px;line-height:1.6;">
                            <a href="{{.PasswordResetURL}}" style="color:#2563eb;">{{.PasswordResetURL}}</a>
                        </p>
                        <hr style="margin:32px 0;border:0;border-top:1px solid #e5e7eb;">
                        <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;">{{.I18n.IgnoreMsg}}</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px;background:#f9fafb;font-size:12px;line-height:1.5;color:#6b7280;text-align:center;">
                        © {{.CurrentYear}} BeexSter. {{.I18n.FooterRight}}
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
